name: Guardar y Confirmar Cambios (Git Commit & Push)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Mensaje del commit (dejar vacío para usar commit_message.txt)'
        required: false
        default: ''
        type: string
      branch_name:
        description: 'Rama destino'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

jobs:
  commit-and-push:
    name: Confirmar y Guardar Cambios
    runs-on: ubuntu-latest
    # Evita que el workflow se ejecute en bucle si el commit fue hecho por el bot
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_name || github.ref_name }}
          fetch-depth: 2

      - name: ⚙️ Configurar identidad de Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Aplicar mensaje de commit y sincronizar
        run: |
          TARGET_BRANCH="${{ inputs.branch_name || github.ref_name }}"
          
          # Verificar si commit_message.txt existe y no está vacío
          if [ -n "${{ inputs.commit_message }}" ]; then
            MSG="${{ inputs.commit_message }}"
          elif [ -f "commit_message.txt" ] && [ -s "commit_message.txt" ]; then
            MSG=$(cat commit_message.txt)
          else
            MSG="chore: Actualización automática de código y recursos"
          fi

          # Añadir cambios si los hay
          git add -A

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Evento Push detectado. Actualizando el último commit con el contenido de commit_message.txt..."
            # Reescribir el commit con el mensaje exacto de commit_message.txt sin crear commits vacíos
            git commit --amend -m "$MSG"
            git push --force-with-lease origin "$TARGET_BRANCH"
          else
            if git diff --staged --quiet; then
              echo "No hay cambios pendientes. Actualizando mensaje del último commit..."
              git commit --amend -m "$MSG"
              git push --force-with-lease origin "$TARGET_BRANCH"
            else
              git commit -m "$MSG"
              git push origin "$TARGET_BRANCH"
            fi
          fi

