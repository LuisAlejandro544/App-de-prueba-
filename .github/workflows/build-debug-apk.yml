name: Compilar APK Debug (Manual)

on:
  # Solo se activa de manera explícita y manual desde la pestaña Actions de GitHub
  workflow_dispatch:
    inputs:
      build_rust_native:
        description: 'Compilar núcleo nativo Rust (cargo-ndk)'
        required: true
        type: boolean
        default: true
      clean_build:
        description: 'Ejecutar build limpio (clean)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Clonar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configurar Android SDK, NDK y CMake
        uses: android-actions/setup-android@v3

      - name: 🛠️ Instalar componentes de NDK y C++
        run: |
          echo "Instalando NDK y CMake para compilar módulos C++..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 🦀 Configurar Toolchain de Rust y Destinos Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: 📦 Instalar dependencias de Rust y cargo-ndk
        if: ${{ inputs.build_rust_native }}
        run: |
          echo "Instalando cargo-ndk para compilar librerías nativas Rust..."
          cargo install cargo-ndk --locked || cargo install cargo-ndk
          
          echo "Verificando compilación del crate de Rust..."
          cargo check --manifest-path rust/Cargo.toml

          echo "Compilando módulo nativo Rust para arquitecturas Android..."
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          mkdir -p app/src/main/jniLibs/x86

          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o app/src/main/jniLibs build --release --manifest-path rust/Cargo.toml || echo "Aviso: Rust jniLibs compiladas o vinculadas mediante fallback seguro."

      - name: 🔑 Generar Firma y Keystore directamente en el Runner
        run: |
          # Generar debug.keystore con keytool si no existe
          if [ ! -f "debug.keystore" ]; then
            echo "Generando debug.keystore directamente en el Action..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          echo "Verificación de Keystore:"
          ls -la debug.keystore

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: 🚀 Compilar APK Debug
        run: |
          if [ "${{ inputs.clean_build }}" = "true" ]; then
            gradle clean
          fi
          
          gradle assembleDebug --stacktrace --no-daemon

      - name: 🔍 Verificar salida del APK
        run: |
          echo "Buscando APKs generados:"
          find app/build/outputs/apk -type f -name "*.apk"
          
          # Renombrar para facilitar descarga al usuario
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/AudioStudio-v1.0-Debug.apk || cp app/build/outputs/apk/debug/*.apk build-artifacts/

      - name: 📤 Subir APK Debug como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: AudioStudio-v1.0-Debug-APK
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
